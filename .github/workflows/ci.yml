name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python · Electron · renderer · bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: janus_server/uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync backend dependencies
        run: uv sync --project janus_server --locked

      - name: Install desktop runtime tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep zsh

      - name: Verify product versions
        run: uv run --project janus_server python scripts/check_versions.py

      - name: Python tests
        run: uv run --project janus_server pytest janus_server/tests -q

      - name: Install Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js dependencies
        working-directory: janus
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        working-directory: janus
        run: pnpm exec tsc --noEmit

      - name: Electron main and renderer tests
        working-directory: janus
        run: pnpm test

      - name: Production build and bundle budget
        working-directory: janus
        run: pnpm check:bundle

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Export locked Python production dependencies
        run: uv export --project janus_server --locked --no-dev --format requirements-txt --output-file $RUNNER_TEMP/janus-requirements.txt

      - name: Python dependency audit
        run: uvx pip-audit --disable-pip --require-hashes --requirement $RUNNER_TEMP/janus-requirements.txt

      - name: Install Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Node production dependency audit
        working-directory: janus
        run: pnpm audit --prod --audit-level high
