name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python · Electron · renderer · bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: janus_server/uv.lock

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync backend dependencies
        run: uv sync --project janus_server --locked

      - name: Install desktop runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep zsh
          touch "$HOME/.zshrc"
          printf 'unsetopt GLOBAL_RCS\n' > "$HOME/.zshenv"

      - name: Verify product versions
        run: uv run --project janus_server python scripts/check_versions.py

      - name: Python tests
        run: uv run --project janus_server pytest janus_server/tests -q

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node.js dependencies
        working-directory: janus
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        working-directory: janus
        run: pnpm exec tsc --noEmit

      - name: Electron main and renderer tests
        working-directory: janus
        run: pnpm test

      - name: Production build and bundle budget
        working-directory: janus
        run: pnpm check:bundle

  macos:
    # 여기서만 검증되는 것: 패키징, MLX 런타임 해결, bootstrap 게이트.
    # Linux 잡은 이 셋 중 무엇도 건드리지 못한다 — mlx 휠은 Apple Silicon 전용이고
    # electron-builder --mac은 macOS에서만 돈다. 공개 저장소라 러너 시간은 무료다.
    name: macOS packaging · MLX runtime
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: qwen3.8mlx/uv.lock

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # 새 사용자가 가장 먼저 치는 명령이다. 이게 깨지면 첫인상에서 막힌다.
      - name: Bootstrap preflight
        run: zsh scripts/bootstrap_macos.sh --check-only

      # mlx-lm·mlx-vlm은 Apple Silicon 휠만 있다. 이 잠금이 실제로 설치되는지는
      # 지금까지 아무 데서도 확인되지 않았다.
      - name: Resolve the MLX model runtime
        run: uv sync --project qwen3.8mlx --locked

      - name: Install Node.js dependencies
        working-directory: janus
        run: pnpm install --frozen-lockfile

      - name: Package the app
        working-directory: janus
        run: pnpm package:mac

      - name: The packaged app carries what it must
        working-directory: janus
        # 실제로 깨질 수 있는 것들이다 — 고지가 빠지면 라이선스 위반이고,
        # 백엔드가 빠지면 실행되지 않는 빈 껍데기가 그대로 나간다.
        run: |
          contents="dist/mac-arm64/Janus.app/Contents"
          for path in \
            MacOS/Janus \
            Resources/app.asar \
            Resources/icon.icns \
            Resources/LICENSE \
            Resources/THIRD-PARTY-NOTICES.md \
            Resources/janus_server/janus_server/server.py \
            Resources/janus_server/uv.lock \
            Resources/qwen3.8mlx/pyproject.toml
          do
            if [ ! -e "$contents/$path" ]; then
              echo "packaged app is missing $path"
              exit 1
            fi
          done
          echo "packaged app carries all required resources"

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Export locked Python production dependencies
        run: uv export --project janus_server --locked --no-dev --format requirements-txt --output-file $RUNNER_TEMP/janus-requirements.txt

      - name: Python dependency audit
        run: uvx pip-audit --disable-pip --require-hashes --requirement $RUNNER_TEMP/janus-requirements.txt

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Third-party notices are current
        working-directory: janus
        run: pnpm check:notices

      - name: Node dependency audit
        working-directory: janus
        # --prod가 아니다. Vite가 renderer 의존성을 전부 번들하므로 dependencies가
        # 비어 있고, 실제로 사용자에게 가는 코드는 devDependencies에서 온다.
        # --prod를 쓰면 아무것도 감사하지 않는 감사가 된다.
        run: pnpm audit --audit-level high
