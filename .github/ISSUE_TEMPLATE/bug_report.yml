name: Bug report
description: Something in Janus behaves differently than it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Janus is a one-person project. A report I can reproduce gets fixed; a
        report I cannot reproduce usually does not. The fields below are the
        ones that decide which it is.

        **Do not file a security problem here.** See
        [SECURITY.md](https://github.com/tpals0409/Janus/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what Janus did, and what you expected instead.
      placeholder: |
        1. Created a Task against ~/code/my-repo
        2. Asked it to rename a function
        3. The turn ended with … but I expected …
    validations:
      required: true

  - type: dropdown
    id: path
    attributes:
      label: Which execution path
      description: >
        The local model and the subscription CLIs are entirely different code
        paths. Guessing wrong sends me to the wrong half of the codebase.
      options:
        - Local model (Qwen3.8-27B via MLX)
        - Claude Code subscription CLI
        - Codex subscription CLI
        - Not sure / not applicable
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Janus version
      description: >
        The release tag you installed, or the `version` field in
        `janus/package.json` if you built it yourself.
      placeholder: v1.0.29
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Machine
      description: macOS version, chip, and unified memory.
      placeholder: macOS 15.5, M4 Max, 128 GB
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: >
        Anything Janus printed, plus the terminal output if you launched it from
        a terminal. **Read it before pasting** — it can contain paths, file
        contents, and repository names.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed anything private from the logs I pasted.
          required: true
