[project]
name = "janus-server"
version = "1.0.28"
description = "Janus backend — Task orchestration, workspaces, verification, and review"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "SeMin Kim" }]

dependencies = [
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/tpals0409/Janus"
Issues = "https://github.com/tpals0409/Janus/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "websockets>=16.1.1",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
# 패키지를 설치하지 않고 리포에서 바로 테스트를 돌린다 (uv init --bare 프로젝트)
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["artifacts", "tasksuite"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle 오류 하위집합, F: pyflakes, I: isort,
# B: bugbear(실버그 성격의 안티패턴), UP: pyupgrade
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
