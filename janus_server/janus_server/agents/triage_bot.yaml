name: Triage Bot
version: 1
nodes:
- id: start
  type: start
  outputs:
  - input
  position:
    x: 80
    y: 200
- id: end
  type: end
  inputs:
    result: '{{ triage.llm_out }}'
  position:
    x: 420
    y: 200
- id: triage
  type: llm
  position:
    x: 660
    y: 300
  model:
    provider: local
    name: qwen3.8-27b
    temperature: 0
    max_tokens: 200
  system_prompt: You are a helpful assistant.
  inputs: {}
  output:
    name: llm_out
    type: string
  prompt: '{{ start.input }}'
edges:
- from: start
  to: triage
- from: triage
  to: end
